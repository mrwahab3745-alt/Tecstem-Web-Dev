<!DOCTYPE html>
<html lang="en">

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .card{
            height: 200px;
            width: 200px;
            box-shadow: 1px 1px 4px black;
            position: relative;
        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: red;
            position: absolute;
            z-index: -1;  
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 8, 255);
            z-index: 100;
            position: absolute;
            left: 50px;
            top: 50px;
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color: rgb(9, 239, 9);
            position: absolute;
            left: 100px;
            top: 100px;
        }
                .box4{
            height: 100px;
            width: 100px;
            background-color: rgb(239, 9, 178);
            position: absolute;
            left: 100px;
            bottom: 100px;
        }
                .box5{
            height: 100px;
            width: 100px;
            background-color: rgb(239, 239, 9);
            position: absolute;
            top: 100px;
            
        }
        .img{
            /* min-width: 400px;

            width: 460px;
            /* opacity: 0.5; */
            border: solid red 5px;

            /* background-size: cover; */
            line-height: 100px;
        }
        .img h1{
            color: rgb(222, 29, 29);
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>
